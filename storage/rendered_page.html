<script id="browser-logger-active">
(function() {
    const ENDPOINT = 'http://localhost/_boost/browser-logs';
    const logQueue = [];
    let flushTimeout = null;

    console.log('🔍 Browser logger active (MCP server detected). Posting to: ' + ENDPOINT);

    // Store original console methods
    const originalConsole = {
        log: console.log,
        info: console.info,
        error: console.error,
        warn: console.warn,
        table: console.table
    };

    // Helper to safely stringify values
    function safeStringify(obj) {
        const seen = new WeakSet();
        return JSON.stringify(obj, (key, value) => {
            if (typeof value === 'object' && value !== null) {
                if (seen.has(value)) return '[Circular]';
                seen.add(value);
            }
            if (value instanceof Error) {
                return {
                    name: value.name,
                    message: value.message,
                    stack: value.stack
                };
            }
            return value;
        });
    }

    // Batch and send logs
    function flushLogs() {
        if (logQueue.length === 0) return;

        const batch = logQueue.splice(0, logQueue.length);

        fetch(ENDPOINT, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify({ logs: batch })
        }).catch(err => {
            // Silently fail to avoid infinite loops
            originalConsole.error('Failed to send logs:', err);
        });
    }

    // Debounced flush (100ms)
    function scheduleFlush() {
        if (flushTimeout) clearTimeout(flushTimeout);
        flushTimeout = setTimeout(flushLogs, 100);
    }

    // Intercept console methods
    ['log', 'info', 'error', 'warn', 'table'].forEach(method => {
        console[method] = function(...args) {
            // Call original method
            originalConsole[method].apply(console, args);

            // Capture log data
            try {
                logQueue.push({
                    type: method,
                    timestamp: new Date().toISOString(),
                    data: args.map(arg => {
                        try {
                            return typeof arg === 'object' ? JSON.parse(safeStringify(arg)) : arg;
                        } catch (e) {
                            return String(arg);
                        }
                    }),
                    url: window.location.href,
                    userAgent: navigator.userAgent
                });

                scheduleFlush();
            } catch (e) {
                // Fail silently
            }
        };
    });

    // Global error handlers for uncaught errors
    const originalOnError = window.onerror;
    window.onerror = function boostErrorHandler(errorMsg, url, lineNumber, colNumber, error) {
        try {
            logQueue.push({
                type: 'uncaught_error',
                timestamp: new Date().toISOString(),
                data: [{
                    message: errorMsg,
                    filename: url,
                    lineno: lineNumber,
                    colno: colNumber,
                    error: error ? {
                        name: error.name,
                        message: error.message,
                        stack: error.stack
                    } : null
                }],
                url: window.location.href,
                userAgent: navigator.userAgent
            });

            scheduleFlush();
        } catch (e) {
            // Fail silently
        }

        // Call original handler if it exists
        if (originalOnError && typeof originalOnError === 'function') {
            return originalOnError(errorMsg, url, lineNumber, colNumber, error);
        }

        // Let the error continue to propagate
        return false;
    }
    window.addEventListener('error', (event) => {
        try {
            logQueue.push({
                type: 'window_error',
                timestamp: new Date().toISOString(),
                data: [{
                    message: event.message,
                    filename: event.filename,
                    lineno: event.lineno,
                    colno: event.colno,
                    error: event.error ? {
                        name: event.error.name,
                        message: event.error.message,
                        stack: event.error.stack
                    } : null
                }],
                url: window.location.href,
                userAgent: navigator.userAgent
            });

            scheduleFlush();
        } catch (e) {
            // Fail silently
        }

        // Let the error continue to propagate
        return false;
    });
    window.addEventListener('unhandledrejection', (event) => {
        try {
            logQueue.push({
                type: 'error',
                timestamp: new Date().toISOString(),
                data: [{
                    message: 'Unhandled Promise Rejection',
                    reason: event.reason instanceof Error ? {
                        name: event.reason.name,
                        message: event.reason.message,
                        stack: event.reason.stack
                    } : event.reason
                }],
                url: window.location.href,
                userAgent: navigator.userAgent
            });

            scheduleFlush();
        } catch (e) {
            // Fail silently
        }

        // Let the rejection continue to propagate
        return false;
    });

    // Flush on page unload
    window.addEventListener('beforeunload', () => {
        if (logQueue.length > 0) {
            navigator.sendBeacon(ENDPOINT, JSON.stringify({ logs: logQueue }));
        }
    });
})();

    <script>
        window.toast = function(payload){
            window.dispatchEvent(new CustomEvent('mary-toast', {detail: payload}))
        }

        document.addEventListener('livewire:init', () => {
            Livewire.hook('request', ({fail}) => {
                fail(({status, content, preventDefault}) => {
                    try {
                        let result = JSON.parse(content);

                        if (result?.toast && typeof window.toast === "function") {
                            window.toast(result);
                        }

                        if ((result?.prevent_default ?? false) === true) {
                            preventDefault();
                        }
                    } catch (e) {
                        console.log(e)
                    }
                })
            })
        })
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const keys = ['cycle_id', 'user_id', 'career_id', 'subject_id'];
            const sessions = {
                cycle_id: null,
                user_id: null,
                career_id: null,
                subject_id: null            };

            // Inicializar cycle_id si no existe
            if (!localStorage.getItem('cycle_id')) {
                localStorage.setItem('cycle_id', sessions.cycle_id || new Date().getFullYear());
            }

            // Sincronizar contexto en LOTE (Batch) para reducir roundtrips
            const toSync = [];
            keys.forEach(key => {
                const val = localStorage.getItem(key);
                if (val && val != sessions[key]) {
                    toSync.push({ 
                        type: key, 
                        value: val, 
                        name: localStorage.getItem(key + '_name') // Enviar nombre cacheado
                    });
                }
            });

            if (toSync.length > 0) {
                window.Livewire.dispatch('context-batch-sync', { items: toSync });
            }

            // Actualizar visualmente el Dashboard en el menú
            const updateDashboardUI = () => {
                const dashboardTitle = document.querySelector('[title^="Dashboard"]');
                if (dashboardTitle) {
                    const cycle = localStorage.getItem('cycle_id');
                    dashboardTitle.innerText = `Dashboard ${cycle}`;
                }
            };
            
            updateDashboardUI();

            // Escuchar actualizaciones de contexto
            window.addEventListener('context-updated', event => {
                localStorage.setItem(event.detail.type, event.detail.value);
                if (event.detail.name) {
                    localStorage.setItem(event.detail.type + '_name', event.detail.name);
                }
                if (event.detail.type === 'cycle_id') updateDashboardUI();
                
                // Si se actualizó la materia, recargar para que aparezca "Contenidos" en el menú
                if (event.detail.type === 'subject_id') {
                    setTimeout(() => window.location.reload(), 500);
                }
            });

            window.addEventListener('context-cleared', event => {
                localStorage.removeItem(event.detail.type);
                localStorage.removeItem(event.detail.type + '_name');
                if (event.detail.type === 'subject_id') window.location.reload();
            });
            
            window.addEventListener('cycle-updated', event => {
                localStorage.setItem('cycle_id', event.detail.cycle);
                updateDashboardUI();
            });
        });
    </script>
